name: test

# This workflow is authored locally but has not yet had a real GitHub Actions
# run: this checkout has no configured Git remote. Treat the first remote run
# as required verification, especially for SQLite and localhost HTTP behavior.

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # CI uses Ubuntu's SQLite library. The local test helper only overrides
      # loading when a sandbox-specific project-local binary exists, so it is
      # inert on this runner.
      - name: Install SQLite runtime
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0

      - name: Install Melos
        run: dart pub global activate melos 2.9.0

      - name: Bootstrap workspace
        run: dart pub global run melos bootstrap

      - name: Verify formatting
        run: dart format --set-exit-if-changed packages example

      - name: Verify generated sources
        run: dart pub global run melos run generate

      - name: Analyze packages
        # These are deliberately invalid negative fixtures. Their dedicated
        # generator tests assert the expected build failures.
        run: dart pub global run melos exec --fail-fast --ignore=sync_engine_generator_invalid_id_fixture --ignore=drift_remove_fixture -- dart analyze

      - name: Test packages
        run: dart pub global run melos exec --fail-fast --ignore=sync_engine_generator --ignore=sync_engine_generator_good_fixture --ignore=sync_engine_generator_invalid_id_fixture --ignore=drift_bootstrap_fixture --ignore=drift_additive_fixture --ignore=drift_remove_fixture -- dart test

      # Fixtures are standalone packages, so Melos does not bootstrap their
      # package configs on a fresh checkout.
      - name: Resolve generator fixtures
        working-directory: packages/sync_engine_generator
        run: |
          for fixture in test/fixtures/good test/fixtures/invalid_id test/fixtures/drift_bootstrap test/fixtures/drift_additive test/fixtures/drift_remove; do
            (cd "$fixture" && dart pub get)
          done

      - name: Test generator migration fixtures
        working-directory: packages/sync_engine_generator
        run: |
          dart test test/bootstrap_schema_test.dart test/drift_migration_fixture_test.dart -r expanded
          (cd test/fixtures/good && dart test -r expanded)
          (cd test/fixtures/drift_bootstrap && dart test -r expanded)
          (cd test/fixtures/drift_additive && dart test -r expanded)
          (cd test/fixtures/drift_remove && dart test -r expanded)

      # The test owns the Shelf process lifecycle. Setting this opt-in flag
      # makes the real localhost TaskTransport/Shelf contract run on CI.
      - name: Test task-manager example including live HTTP transport
        working-directory: example/task_manager
        env:
          RUN_HTTP_INTEGRATION: 'true'
        run: flutter test -r expanded

      - name: Test external notes consumer
        working-directory: example/notes_app
        run: flutter test -r expanded

      - name: Analyze valid generator fixtures
        working-directory: packages/sync_engine_generator
        run: |
          for fixture in test/fixtures/good test/fixtures/drift_bootstrap test/fixtures/drift_additive; do
            (cd "$fixture" && dart analyze)
          done

      - name: Test minimal consumer
        working-directory: example/minimal_app
        run: flutter test -r expanded

      - name: Test conflict playground
        working-directory: example/conflict_playground
        run: flutter test -r expanded
