name: flutter_sync_engine
packages:
  - packages/**

command:
  bootstrap:
    environment:
      sdk: ^3.5.0

scripts:
  analyze:
    description: Analyze all workspace packages and consumer examples.
    run: dart pub global run melos exec --fail-fast --ignore=sync_engine_generator_invalid_id_fixture --ignore=drift_remove_fixture -- dart analyze && (cd example/task_manager && flutter analyze) && (cd example/notes_app && flutter analyze)
  test:
    description: Run package, fixture, and consumer-example tests.
    run: dart pub global run melos exec --fail-fast --ignore=sync_engine_generator --ignore=sync_engine_generator_good_fixture --ignore=sync_engine_generator_invalid_id_fixture --ignore=drift_bootstrap_fixture --ignore=drift_additive_fixture --ignore=drift_remove_fixture -- dart test && (cd packages/sync_engine_generator && dart test test/bootstrap_schema_test.dart test/drift_migration_fixture_test.dart -r expanded) && (cd packages/sync_engine_generator/test/fixtures/good && dart test -r expanded) && (cd packages/sync_engine_generator/test/fixtures/drift_bootstrap && dart test -r expanded) && (cd packages/sync_engine_generator/test/fixtures/drift_additive && dart test -r expanded) && (cd packages/sync_engine_generator/test/fixtures/drift_remove && dart test -r expanded) && (cd example/task_manager && flutter test) && (cd example/notes_app && flutter test)
  generate:
    description: Regenerate checked-in Drift and Syncable outputs.
    run: (cd packages/sync_engine_drift && dart run build_runner build --delete-conflicting-outputs) && (cd example/task_manager && dart run build_runner build --delete-conflicting-outputs) && (cd example/notes_app && dart run build_runner build --delete-conflicting-outputs)
